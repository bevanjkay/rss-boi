version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint does not support TS 7.0, so bumping TypeScript past
      # 6.x breaks `pnpm lint` for every workspace. Remove this once
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # ships TS >=7 support.
      - dependency-name: typescript
        versions:
          - ">=7"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      gh-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories:
      - /
      - /**/*
    schedule:
      interval: weekly
      day: monday
      time: !!str 08:00
      timezone: Australia/Melbourne
    groups:
      docker-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
