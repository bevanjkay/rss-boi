<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="#0f1114" name="theme-color" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="RSS Boi" name="apple-mobile-web-app-title" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
    <link href="/manifest.webmanifest" rel="manifest" />
    <link href="/favicon.png" rel="icon" type="image/png" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <title>RSS Boi</title>
    <script src="/config.js"></script>
    <script>
      // Paint the saved theme before the app loads, so it never flashes the default.
      try {
        var saved = JSON.parse(localStorage.getItem("rss-boi:applied-appearance") || "null");
        if (saved) {
          var root = document.documentElement;
          for (var name in saved.variables) root.style.setProperty("--" + name, saved.variables[name]);
          root.style.colorScheme = saved.scheme;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", saved.themeColor);
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
